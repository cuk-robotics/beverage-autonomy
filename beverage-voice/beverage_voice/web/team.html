<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F4F6">
<title>음료 로봇 팀</title>
<style>
  :root {
    --blue: #3182F6; --blue-dark: #1B64DA; --blue-50: #E8F3FF;
    --g900: #191F28; --g700: #4E5968; --g600: #6B7684; --g500: #8B95A1; --g400: #B0B8C1;
    --g200: #E5E8EB; --g100: #F2F4F6; --g50: #F9FAFB;
    --red: #F04452; --red-50: #FFEEEE; --green: #1FAF62; --green-50: #E9F8F0; --orange: #FF8A00; --orange-50: #FFF4E5;
    --coffee: #B5413A; --icetea: #2C67C7; --greentea: #3E8E3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--g100); color: var(--g900);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5; word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.2px; }
  .lead { color: var(--g600); font-size: 14px; margin: 0 0 20px; }
  h2 { font-size: 14px; font-weight: 600; color: var(--g600); margin: 24px 4px 10px; }
  .card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
  .badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--g100); color: var(--g600); margin-bottom: 10px; }
  .badge.blue { background: var(--blue-50); color: var(--blue); }
  .badge.green { background: var(--green-50); color: var(--green); }
  .badge.orange { background: var(--orange-50); color: var(--orange); }
  .badge.red { background: var(--red-50); color: var(--red); }
  #status { font-size: 20px; font-weight: 700; margin: 0; line-height: 1.35; }
  #sub { color: var(--g600); font-size: 14px; margin: 6px 0 0; min-height: 1.4em; }
  .steps { list-style: none; display: flex; gap: 6px; margin: 14px 0 0; padding: 0; }
  .steps li { flex: 1; text-align: center; padding: 8px 4px 6px; border-radius: 10px; background: var(--g50); color: var(--g500); font-size: 12px; font-weight: 600; border-top: 3px solid var(--g200); }
  .steps li.done { color: var(--g700); border-top-color: var(--g400); }
  .steps li.current { background: var(--blue-50); color: var(--blue); border-top-color: var(--blue); }
  .steps:empty { display: none; }

  button { font: inherit; font-size: 16px; font-weight: 600; min-height: 54px; padding: 12px 14px; border: 0; border-radius: 14px; color: #fff; background: var(--blue); cursor: pointer; touch-action: manipulation; width: 100%; transition: transform 0.12s, opacity 0.2s; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.35; cursor: default; transform: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--g900); outline-offset: 2px; }
  button .sub { display: block; font-size: 12px; font-weight: 500; opacity: 0.85; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .wide { grid-column: 1 / -1; }
  .danger { background: var(--red); min-height: 64px; font-size: 18px; }
  .ghost { background: #fff; color: var(--g900); border: 1.5px solid var(--g200); }
  .ghost.on { border-color: var(--green); color: var(--green); background: var(--green-50); }
  .drink { background: #fff; color: var(--g900); border: 1.5px solid var(--g200); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 14px; }
  .drink i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .drink[data-text="커피"] i { background: var(--coffee); } .drink[data-text="아이스티"] i { background: var(--icetea); } .drink[data-text="말차"] i { background: var(--greentea); }
  .task { background: #fff; color: var(--g900); border: 1.5px solid var(--g200); }
  .task.powder_coffee { border-color: var(--coffee); color: var(--coffee); }
  .task.powder_icetea { border-color: var(--icetea); color: var(--icetea); }
  .task.powder_greentea { border-color: var(--greentea); color: var(--greentea); }
  .task.water { border-color: var(--blue); color: var(--blue); }
  .task.stir { border-color: var(--g700); color: var(--g700); }
  .field { margin-top: 10px; }
  label { display: block; color: var(--g600); font-size: 13px; font-weight: 600; margin: 0 4px 6px; }
  input { width: 100%; font: inherit; font-size: 16px; padding: 14px; border-radius: 14px; background: #fff; color: var(--g900); border: 1.5px solid var(--g200); }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: rgba(25, 31, 40, 0.92); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  details { border-top: 1px solid var(--g100); padding: 12px 0 4px; }
  details:first-child { border-top: 0; padding-top: 0; }
  summary { cursor: pointer; color: var(--g700); font-size: 14px; font-weight: 600; }
  pre { margin: 10px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--g700); background: var(--g50); padding: 12px; border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--g100); vertical-align: top; }
  th { color: var(--g500); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>팀 제어</h1>
  <p class="lead">이 화면의 명령이 진행 중인 리스트보다 우선해요.</p>

  <section class="card" aria-live="polite">
    <span class="badge" id="badge">연결 중</span>
    <p id="status">연결 확인 중</p>
    <p id="sub"></p>
    <ol class="steps" id="steps"></ol>
  </section>

  <h2>지금 당장</h2>
  <div class="grid">
    <button id="stop" class="danger wide">중지<span class="sub">지금 동작을 끝내고 시작 자세로 돌아가요</span></button>
    <button id="home" class="ghost">초기 위치로 이동<span class="sub">쉬고 있으면 home 모드 실행</span></button>
    <button id="resume" class="ghost">주문 받기<span class="sub">작업대 정리가 끝났을 때</span></button>
  </div>

  <h2>음료 만들기 (가루 → 물 → 젓기)</h2>
  <div class="grid3">
    <button class="drink" data-text="커피"><i></i>커피</button>
    <button class="drink" data-text="아이스티"><i></i>아이스티<span class="sub">젓기 없음</span></button>
    <button class="drink" data-text="말차"><i></i>말차</button>
  </div>

  <h2>task 하나만 (리스트는 버려요)</h2>
  <div class="grid" id="tasks">
    <button class="task powder_coffee" data-task="powder_coffee">커피 가루</button>
    <button class="task powder_icetea" data-task="powder_icetea">아이스티 가루</button>
    <button class="task powder_greentea" data-task="powder_greentea">말차 가루</button>
    <button class="task water" data-task="water">물 붓기</button>
    <button class="task stir wide" data-task="stir">젓기<span class="sub">커피·말차만 학습됨</span></button>
  </div>
  <div class="field">
    <label for="duration">상한 시간(초, 1~300). 비우면 task 기본값</label>
    <input id="duration" type="number" min="1" max="300" step="1" inputmode="numeric" placeholder="기본값">
  </div>

  <h2>자세히</h2>
  <section class="card">
    <details><summary>로봇 쪽 마지막 출력 (오류 원인)</summary><pre id="stderr"></pre></details>
    <details><summary>마지막 응답</summary><pre id="result">아직 없음</pre></details>
    <details><summary>서버 설정</summary><pre id="config"></pre></details>
    <details><summary>실행 명령</summary><pre id="commands"></pre></details>
    <details><summary>최근 기록</summary>
      <table><thead><tr><th>시각</th><th>종류</th><th>내용</th></tr></thead><tbody id="events"></tbody></table>
    </details>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// 팀 화면. 팀 토큰으로만 열린다. /infer, /stop, /resume, /home, /debug는 이 토큰이 있어야 쓸 수 있다.
const token = new URLSearchParams(location.search).get("token") || "";
const TASKS = __TASKS__;  // {단계 이름: [task 문장, 기본 상한 초]}. 서버가 채워 준다
const NAMES = {coffee: "커피", icetea: "아이스티", greentea: "말차"};
const $ = id => document.getElementById(id);
let toastTimer = null, busyRequest = false;

function toast(text) {
  const box = $("toast");
  box.textContent = text;
  box.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("show"), 2600);
}

async function call(path, body) {
  busyRequest = true;
  try {
    const response = await fetch(path, {method: body === undefined ? "GET" : "POST",
      headers: {"X-Token": token, ...(body !== undefined ? {"Content-Type": "application/json"} : {})}, body});
    const data = await response.json();
    if (body !== undefined) {
      $("result").textContent = `${response.status} ${path}\n` + JSON.stringify(data, null, 1);
      toast(describe(path, response.status, data));
    }
    return data;
  } catch (error) {
    if (body !== undefined) toast("서버에 연결할 수 없어요");
    $("result").textContent = `${path} 실패: ${error}`;
    return null;
  } finally { busyRequest = false; }
}

function describe(path, status, data) {
  if (status === 403) return "토큰이 맞지 않아요. 주소를 다시 받아 주세요";
  if (path === "/stop") return status === 202 ? "멈추는 중이에요" : "지금 돌고 있는 작업이 없어요";
  if (path === "/resume") return status === 202 ? "주문을 다시 받아요" : "정리 중 상태가 아니에요";
  if (path === "/home") return status === 202 ? (data.action === "stop" ? "멈추고 시작 자세로 돌아가요" : "초기 위치로 이동해요") : "이미 멈추는 중이에요";
  if (path === "/infer") return status === 202 ? (data.preempted ? "리스트를 버리고 이 task를 시작해요" : "이 task를 시작해요") : (data.error || "실행하지 못했어요");
  if (path === "/command") {
    if (status === 202) return `${NAMES[data.drink]} 리스트를 시작해요`;
    if (data.code === "hold") return "먼저 '주문 받기'를 눌러 주세요";
    if (data.code === "busy") return "지금 돌고 있어요. 중지하거나 끝나길 기다려요";
    return data.error || "주문하지 못했어요";
  }
  return status === 202 ? "보냈어요" : (data.error || "실패했어요");
}

$("stop").onclick = () => call("/stop", "{}").then(refresh);
$("home").onclick = () => call("/home", "{}").then(refresh);
$("resume").onclick = () => call("/resume", "{}").then(refresh);
for (const button of document.querySelectorAll(".drink"))
  button.onclick = () => call("/command", JSON.stringify({text: button.dataset.text})).then(refresh);
for (const button of document.querySelectorAll("#tasks button")) {
  button.onclick = () => {
    const seconds = $("duration").value ? Number($("duration").value) : null;  // 빈 칸은 null이라 서버가 기본값을 쓴다
    call("/infer", JSON.stringify({task: button.dataset.task, duration_s: seconds})).then(refresh);
  };
}

function stepLabel(task) {
  if (!task) return "";
  if (task === "home") return "초기 자세";
  if (task.includes("powder")) return "가루 붓기";
  if (task.includes("water")) return "물 붓기";
  return "젓기";
}

function show(state) {
  const status = $("status"), sub = $("sub"), badge = $("badge"), steps = $("steps");
  steps.replaceChildren();
  if (!state) { badge.textContent = "연결 끊김"; badge.className = "badge red"; status.textContent = "서버에 연결할 수 없어요"; sub.textContent = ""; return; }
  const name = NAMES[state.drink] || (state.source === "manual" ? "수동 task" : state.source === "home" ? "초기 위치 이동" : "");
  const view = {
    idle: ["대기 중", "green", "주문을 받고 있어요", ""],
    loading: ["준비 중", "blue", `${name} 준비 중`, state.ready ? "곧 시작해요" : "정책 로딩과 장치 연결 중"],
    running: ["진행 중", "blue", `${name} ${state.step}/${state.steps} ${stepLabel(state.task)}`, state.heard ? `들은 말: "${state.heard}"` : ""],
    stopping: ["멈추는 중", "orange", "시작 자세로 돌아가는 중", ""],
    hold: ["정리 중", "orange", "주문을 받지 않아요", ""],
  }[state.phase] || [state.phase, "", state.phase, ""];
  badge.textContent = view[0]; badge.className = "badge " + view[1];
  status.textContent = view[2];
  const last = state.last;
  sub.textContent = state.phase === "hold" && last
    ? `마지막 작업: ${NAMES[last.drink] || last.source || ""} · ${ {complete: "완료", stop: "중지", timeout: "상한 초과", error: "오류"}[last.reason] || last.reason }${last.seconds ? ` · ${last.seconds}초` : ""}${last.message ? "\n" + last.message.split("\n")[0] : ""}`
    : view[3];
  if (state.plan && state.plan.length && (state.phase === "loading" || state.phase === "running" || state.phase === "hold")) {
    state.plan.forEach((task, i) => {
      const item = document.createElement("li");
      item.textContent = stepLabel(task);
      const finished = state.phase === "hold" && last && last.reason === "complete";
      if (i + 1 < state.step || finished) item.className = "done";
      if ((state.phase === "running" || state.phase === "loading") && i + 1 === state.step) item.className = "current";
      steps.append(item);
    });
  }
  const working = state.phase === "loading" || state.phase === "running";
  $("stop").disabled = !working;
  $("resume").disabled = state.phase !== "hold";
  $("resume").classList.toggle("on", state.phase === "hold");
  $("home").disabled = state.phase === "stopping";
}

async function refresh() {
  const state = await call("/status");
  show(state);
  const debug = await call("/debug");
  if (!debug) return;
  $("stderr").textContent = debug.stderr_tail.join("\n") || "(없음)";
  $("config").textContent = JSON.stringify(debug.config, null, 1);
  $("commands").textContent = debug.commands.join("\n\n") || "(없음)";
  $("events").replaceChildren(...debug.events.slice().reverse().map(event => {
    const row = document.createElement("tr");
    const {time, kind, ...rest} = event;
    for (const value of [time, kind, Object.entries(rest).map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`).join(" ")]) {
      const cell = document.createElement("td");
      cell.textContent = value;
      row.append(cell);
    }
    return row;
  }));
}
refresh();
setInterval(() => { if (!busyRequest) refresh(); }, 2000);
</script>
</body>
</html>
