<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F4F6">
<title>음료 로봇</title>
<style>
  /* 흰 카드, 넉넉한 여백, 굵은 제목, 파란 버튼 하나. 외부 폰트와 CDN은 쓰지 않는다. */
  :root {
    --blue: #3182F6; --blue-dark: #1B64DA; --blue-50: #E8F3FF;
    --g900: #191F28; --g700: #4E5968; --g600: #6B7684; --g500: #8B95A1; --g400: #B0B8C1;
    --g200: #E5E8EB; --g100: #F2F4F6; --g50: #F9FAFB;
    --red: #F04452; --red-50: #FFEEEE; --green: #1FAF62; --green-50: #E9F8F0; --orange: #FF8A00; --orange-50: #FFF4E5;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--g100); color: var(--g900);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5; word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 140px; }
  h1 { font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 8px; }
  .lead { color: var(--g600); font-size: 15px; margin: 0 0 24px; }

  .card { background: #fff; border-radius: 20px; padding: 22px 22px 20px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); margin-bottom: 12px; }
  .badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--g100); color: var(--g600); margin-bottom: 12px; }
  .badge.blue { background: var(--blue-50); color: var(--blue); }
  .badge.green { background: var(--green-50); color: var(--green); }
  .badge.orange { background: var(--orange-50); color: var(--orange); }
  .badge.red { background: var(--red-50); color: var(--red); }
  .status { font-size: 22px; font-weight: 700; line-height: 1.35; margin: 0; letter-spacing: -0.2px; }
  .detail { color: var(--g600); font-size: 15px; margin: 8px 0 0; min-height: 1.5em; }

  .steps { list-style: none; display: flex; gap: 8px; margin: 18px 0 0; padding: 0; }
  .steps li { flex: 1; text-align: center; padding: 10px 6px 8px; border-radius: 12px; background: var(--g50); color: var(--g500); font-size: 13px; font-weight: 600; border-top: 3px solid var(--g200); }
  .steps li.done { color: var(--g700); border-top-color: var(--g400); }
  .steps li.current { background: var(--blue-50); color: var(--blue); border-top-color: var(--blue); }
  .steps:empty { display: none; }

  .heard { display: none; }
  .heard.show { display: block; }
  .heard .label { font-size: 13px; color: var(--g500); font-weight: 600; margin: 0 0 6px; }
  .heard .text { margin: 0; font-size: 17px; font-weight: 600; background: var(--g100); border-radius: 14px; padding: 14px 16px; }

  .hint { color: var(--g500); font-size: 13px; margin: 16px 4px 0; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(242, 244, 246, 1) 70%, rgba(242, 244, 246, 0)); }
  .mic {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 520px; margin: 0 auto; min-height: 64px;
    border: 0; border-radius: 18px; background: var(--blue); color: #fff; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    touch-action: none; -webkit-user-select: none; user-select: none; transition: transform 0.12s, background 0.2s;
  }
  .mic:active { transform: scale(0.98); }
  .mic:disabled { background: var(--g200); color: var(--g400); cursor: default; }
  .mic.recording { background: var(--blue-dark); }
  .mic .dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0.9; }
  .mic.recording .dot { background: #FF6B6B; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { .mic.recording .dot { animation: none; } .mic:active { transform: none; } }
  .mic:focus-visible { outline: 3px solid var(--g900); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>음료 로봇에게<br>말해 보세요</h1>
  <p class="lead">아래 버튼을 누른 채로 "말차 한 잔"처럼 말씀해 주세요.<br>말차, 아이스티, 커피 중에서 골라요.</p>

  <section class="card" aria-live="polite">
    <span class="badge" id="badge">연결 중</span>
    <p class="status" id="status">연결하는 중이에요</p>
    <p class="detail" id="detail"></p>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="card heard" id="heard">
    <p class="label">들은 말</p>
    <p class="text" id="heardText"></p>
  </section>

  <p class="hint">로봇이 움직이는 동안은 작업대에 손을 넣지 마세요.</p>
</main>

<div class="dock">
  <button class="mic" id="mic"><span class="dot"></span><span id="micLabel">누르고 말하기</span></button>
</div>

<script>
// 사용자 화면. 음성 주문(/speak)과 진행 상황(/status)만 쓴다. 중지와 수동 실행은 팀 화면에만 있다.
const token = new URLSearchParams(location.search).get("token") || "";
const NAMES = {coffee: "커피", icetea: "아이스티", greentea: "말차"};
const $ = id => document.getElementById(id);
const mic = $("mic"), micLabel = $("micLabel");
const FLASH_MS = 8000;
let lastState = null, flash = null, pending = false;

// 서버 응답 코드를 관객이 알아들을 말로 바꾼다
const MESSAGES = {
  no_drink: ["음료 이름을 못 알아들었어요", "말차, 아이스티, 커피 중에서 말씀해 주세요."],
  ambiguous: ["한 번에 한 잔만 주문할 수 있어요", "말차, 아이스티, 커피 중 하나만 말씀해 주세요."],
  busy: ["지금 다른 음료를 만들고 있어요", "끝나면 다시 주문해 주세요."],
  hold: ["잠시 준비 중이에요", "조금 뒤에 다시 주문해 주세요."],
  no_key: ["음성 주문이 꺼져 있어요", "담당자에게 알려 주세요."],
  no_internet: ["PC 인터넷이 끊겼어요", "담당자에게 알려 주세요."],
  api_key: ["음성 인식 서비스에 문제가 있어요", "담당자에게 알려 주세요."],
  api_limit: ["음성 인식 서비스에 문제가 있어요", "잠시 뒤에 다시 말씀해 주세요."],
  api_down: ["음성 인식 서비스에 문제가 있어요", "잠시 뒤에 다시 말씀해 주세요."],
  bad_audio: ["녹음이 너무 짧았어요", "버튼을 누른 채로 말씀해 주세요."],
  timeout: ["음성 인식이 응답하지 않아요", "잠시 뒤에 다시 말씀해 주세요."],
  token: ["이 화면의 주소가 바뀌었어요", "담당자에게 새 주소를 받아 주세요."],
  mic: ["마이크를 쓸 수 없어요", "브라우저의 마이크 권한을 허용해 주세요."],
  connection: ["로봇과 연결이 끊겼어요", "담당자에게 알려 주세요."],
};

function say(status, detail = "", badge = ["", ""]) {
  $("status").textContent = status;
  $("detail").textContent = detail;
  $("badge").textContent = badge[0];
  $("badge").className = "badge " + badge[1];
}

function showHeard(text) {
  $("heard").classList.toggle("show", Boolean(text));
  $("heardText").textContent = text || "";
}

function notice(code, data) {
  const [status, detail] = MESSAGES[code] || ["주문을 보내지 못했어요", "담당자에게 알려 주세요."];
  flash = [status, detail, Date.now() + FLASH_MS];
  if (data && data.text) showHeard(data.text);
  render(lastState);
}

async function order(blob, type) {
  pending = true;
  render(lastState);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);
  try {
    const response = await fetch("/speak", {method: "POST", headers: {"X-Token": token, "Content-Type": type}, body: blob, signal: controller.signal});
    const data = await response.json();
    pending = false;
    if (response.status !== 202) notice(data.code, data);
    else { flash = null; showHeard(data.text); poll(); }
  } catch (error) {
    pending = false;
    notice(error.name === "AbortError" ? "timeout" : "connection", {});
  } finally { clearTimeout(timer); }
}

// 누르고 있는 동안 녹음하고 손을 떼면 보낸다. 권한 창이 뜬 사이 손을 떼면 녹음을 시작하지 않는다.
let held = false, recorder = null;
mic.oncontextmenu = event => event.preventDefault();
mic.onpointerdown = async () => {
  held = true;
  if (recorder && recorder.state === "recording") recorder.stop();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (error) { held = false; notice("mic", {}); return; }
  if (!held) { stream.getTracks().forEach(track => track.stop()); return; }
  const chunks = [], rec = new MediaRecorder(stream);
  recorder = rec;
  rec.ondataavailable = event => chunks.push(event.data);
  rec.onstop = () => {
    stream.getTracks().forEach(track => track.stop());
    if (recorder === rec) recorder = null;
    mic.classList.remove("recording");
    micLabel.textContent = "누르고 말하기";
    order(new Blob(chunks, {type: rec.mimeType}), rec.mimeType || "audio/webm");
  };
  rec.start();
  mic.classList.add("recording");
  micLabel.textContent = "듣고 있어요 · 손을 떼면 보내요";
};
const release = () => { held = false; if (recorder && recorder.state === "recording") recorder.stop(); };
mic.onpointerup = mic.onpointercancel = mic.onpointerleave = release;

// 몇 분짜리 작업 중에 폰 화면이 꺼지지 않게. 첫 터치 뒤에만 요청할 수 있다.
async function keepAwake() { try { await navigator.wakeLock?.request("screen"); } catch (error) {} }
document.addEventListener("pointerdown", keepAwake, {once: true});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

function stepLabel(task) {
  if (!task) return "";
  if (task === "home") return "초기 자세";
  if (task.includes("powder")) return "가루 붓기";
  if (task.includes("water")) return "물 붓기";
  return "젓기";
}

function render(state) {
  const phase = state ? state.phase : null;
  const working = phase === "loading" || phase === "running" || phase === "stopping";
  const accepting = Boolean(state && state.accepting) && !pending;
  mic.disabled = !accepting;
  if (!accepting && !pending) micLabel.textContent = working ? "만드는 중이에요" : (phase === "hold" ? "잠시 준비 중이에요" : "지금은 주문을 받지 않아요");
  else if (!mic.classList.contains("recording")) micLabel.textContent = "누르고 말하기";
  const steps = $("steps");
  steps.replaceChildren();
  const name = state && NAMES[state.drink] ? NAMES[state.drink] : "";
  if (state && name && (working || (phase === "hold" && state.last))) {
    state.plan.forEach((task, i) => {
      const item = document.createElement("li");
      item.textContent = stepLabel(task);
      const finished = phase === "hold" && state.last && state.last.reason === "complete";
      if (i + 1 < state.step || finished) item.className = "done";
      if (working && i + 1 === state.step) item.className = "current";
      steps.append(item);
    });
  }
  if (state && state.heard && working) showHeard(state.heard);
  if (pending) return say("주문을 알아듣는 중이에요", "", ["잠시만요", "blue"]);
  if (!state) return say("로봇과 연결이 끊겼어요", "담당자에게 알려 주세요.", ["연결 끊김", "red"]);
  if (phase === "loading") {
    if (state.source !== "list") return say("담당자가 로봇을 조작하고 있어요", "잠시만 기다려 주세요.", ["점검 중", "orange"]);
    return say(`${name} 만들 준비를 하고 있어요`, state.ready ? "곧 시작해요." : "로봇이 정책을 불러오고 있어요. 조금만 기다려 주세요.", ["준비 중", "blue"]);
  }
  if (phase === "running") {
    if (state.source !== "list") return say("담당자가 로봇을 조작하고 있어요", stepLabel(state.task), ["점검 중", "orange"]);
    const label = stepLabel(state.task);
    const text = label === "가루 붓기" ? `${name} 가루를 붓고 있어요` : label === "물 붓기" ? "물을 붓고 있어요" : "잘 섞이도록 젓고 있어요";
    return say(text, `${state.step}단계 / ${state.steps}단계`, ["만드는 중", "blue"]);
  }
  if (phase === "stopping") return say("멈추는 중이에요", "로봇이 시작 자세로 돌아가요.", ["멈추는 중", "orange"]);
  if (phase === "hold") {
    const last = state.last || {};
    const done = NAMES[last.drink] || "";
    if (last.reason === "complete" && done) return say(`${done} 완성!`, "다음 주문은 잠시 후에 받을게요.", ["완성", "green"]);
    if (last.reason === "complete") return say("점검이 끝났어요", "다음 주문은 잠시 후에 받을게요.", ["준비 중", "orange"]);
    if (last.reason === "stop") return say("멈췄어요", "담당자가 확인하고 있어요.", ["멈춤", "orange"]);
    return say("동작이 멈췄어요", "담당자를 불러 주세요.", ["확인 필요", "red"]);
  }
  if (flash && Date.now() < flash[2]) return say(flash[0], flash[1], ["다시 한번", "orange"]);
  showHeard("");
  say("주문을 기다리고 있어요", "버튼을 누른 채로 말씀해 주세요.", ["대기 중", "green"]);
}

async function poll() {
  try {
    const response = await fetch("/status", {headers: {"X-Token": token}});
    if (!response.ok) { lastState = null; flash = [...MESSAGES[response.status === 403 ? "token" : "connection"], Infinity]; return render(null); }
    lastState = await response.json();
    if (lastState.phase !== "idle") flash = null;  // 새 작업이 시작되면 이전 안내는 지운다
  } catch (error) { lastState = null; }
  render(lastState);
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
